<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Alur CRUD RuangSiswa</title><desc id="desc">Formulir masuk ke validasi PHP, query PDO, database, kemudian daftar dan detail siswa.</desc><rect width="1000" height="300" rx="20" fill="#f4f6ed"/><text x="42" y="49" font-family="Arial,sans-serif" font-size="12" font-weight="bold" letter-spacing="3" fill="#175e45">RUANGSISWA / ALUR DATA</text><text x="42" y="88" font-family="Arial,sans-serif" font-size="25" fill="#244432">Dari satu formulir, menjadi data yang tertata.</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#d9e3d3"><rect x="40" y="130" width="162" height="104" rx="12"/><rect x="230" y="130" width="162" height="104" rx="12"/><rect x="420" y="130" width="162" height="104" rx="12"/><rect x="610" y="130" width="162" height="104" rx="12"/><rect x="800" y="130" width="162" height="104" rx="12"/></g><g fill="#175e45" font-size="11"><text x="121" y="156">01 / INPUT</text><text x="311" y="156">02 / PEMERIKSAAN</text><text x="501" y="156">03 / PEMROSESAN</text><text x="691" y="156">04 / PENYIMPANAN</text><text x="881" y="156">05 / HASIL</text></g><g fill="#244432" font-size="17" font-weight="bold"><text x="121" y="185">Formulir siswa</text><text x="311" y="185">Validasi PHP</text><text x="501" y="185">Query PDO</text><text x="691" y="185">Database</text><text x="881" y="185">Daftar siswa</text></g><g fill="#72836d" font-size="11"><text x="121" y="210">Lima informasi utama</text><text x="311" y="210">Isian dan token CSRF</text><text x="501" y="210">Nilai berparameter</text><text x="691" y="210">MySQL atau SQLite</text><text x="881" y="210">Detail dan ringkasan</text></g><g stroke="#7c9777" stroke-width="2" fill="none"><path d="M207 182h18m-5-5 5 5-5 5M397 182h18m-5-5 5 5-5 5M587 182h18m-5-5 5 5-5 5M777 182h18m-5-5 5 5-5 5"/></g></g><text x="42" y="272" font-family="Arial,sans-serif" font-size="11" fill="#72836d">CREATE / READ / UPDATE / DELETE</text></svg>
